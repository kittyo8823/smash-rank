<style>
:root { --paper: #f2efe8; --paper2: #e8e3d8; --ink: #141414; --sub: #5d5a54; --mute: #98938a; --red: #e5262b; --yellow: #ffd400;
  --g-pre: #9a958c; --g-near: #2b8fd8; --g-vip: #1f9d55; --g-makyo: #7b3fd1; --g-god: #d4a000; color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--paper); }
body { margin: 0; min-height: 100dvh; color: var(--ink); background: var(--paper); background-image: repeating-linear-gradient(-45deg, rgba(20,20,20,0.025) 0 2px, transparent 2px 9px);
  font-family: 'Zen Kaku Gothic New', system-ui, -apple-system, 'Hiragino Sans', sans-serif; font-weight: 500; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, a.btn { font: inherit; color: inherit; cursor: pointer; text-decoration: none; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
.btn { display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--ink); background: #fff; padding: 11px 14px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation; }
.btn:active { transform: translate(3px, 3px); box-shadow: none; }
.btn.primary { background: var(--red); color: #fff; }
.btn.sub { background: var(--yellow); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { background: var(--ink); color: #fff; }
.btn.big { width: 100%; padding: 15px; font-size: 18px; font-family: 'Dela Gothic One'; font-weight: 400; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.row > .btn { flex: 1; padding-left: 6px; padding-right: 6px; font-size: 14px; }
.in { width: 100%; padding: 12px; border: 2px solid var(--ink); background: #fff; font: inherit; font-size: 18px; outline: none; border-radius: 0; }
.in:focus { box-shadow: 0 0 0 3px var(--yellow); }
.in.num { font-family: 'Dela Gothic One'; letter-spacing: 0.04em; }
.in.small { padding: 6px 8px; font-size: 16px; }
.lbl { display: block; font-size: 12px; font-weight: 700; margin: 12px 0 6px; }
.note { color: var(--sub); font-size: 12px; margin: 10px 0; }
.badge { flex: none; width: 28px; height: 28px; display: inline-grid; place-items: center; background: var(--c); color: #fff; font-family: 'Dela Gothic One'; font-size: 14px; clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 0 10px; }
.brand { flex: 1; font-family: 'Dela Gothic One'; font-size: 17px; line-height: 1.2; }
.brand em { font-style: normal; color: var(--red); display: block; font-size: 19px; }
.border-chip { border: 2px solid var(--ink); background: #fff; padding: 2px 10px; text-align: right; }
.border-chip small { display: block; font-size: 10px; font-weight: 700; color: var(--sub); }
.border-chip b { font-family: 'Dela Gothic One'; font-weight: 400; font-size: 17px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: #fff; border-top: 3px solid var(--ink); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { flex: 1; border: 0; background: none; padding: 14px 4px; font-weight: 700; }
.tabs button.on { background: var(--ink); color: #fff; }
/* 一覧 */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.sum { border: 2px solid var(--ink); background: #fff; padding: 6px 8px; display: flex; align-items: baseline; gap: 6px; border-left: 8px solid var(--gc, var(--mute)); }
.sum b { font-family: 'Dela Gothic One'; font-weight: 400; font-size: 22px; line-height: 1; }
.sum span { font-size: 11px; font-weight: 700; }
.g-pre { --gc: var(--g-pre); } .g-near { --gc: var(--g-near); } .g-vip { --gc: var(--g-vip); } .g-makyo { --gc: var(--g-makyo); } .g-god { --gc: var(--g-god); } .g-none { --gc: var(--mute); }
.seg { display: flex; border: 2px solid var(--ink); background: #fff; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; font-weight: 700; font-size: 14px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--yellow); }
.tierbox { border: 2px solid var(--ink); background: #fff; margin-bottom: 10px; box-shadow: 3px 3px 0 var(--ink); }
.tier-head { display: flex; align-items: baseline; gap: 8px; padding: 6px 10px; background: var(--gc); color: #fff; }
.tier-head .dan { font-family: 'Dela Gothic One'; font-size: 18px; }
.tier-head .tname { font-weight: 700; flex: 1; font-size: 14px; }
.tier-head .th { font-size: 11px; opacity: 0.85; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); background: var(--paper); padding: 3px 8px 3px 3px; font-size: 13px; font-weight: 700; }
.fchip .badge { width: 22px; height: 22px; font-size: 11px; }
.fchip .fg { font-size: 11px; color: var(--sub); font-weight: 500; }
.fchip.off { opacity: 0.5; }
.rows { list-style: none; margin: 0; padding: 0; border: 2px solid var(--ink); background: #fff; }
.rows li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--paper2); border-left: 6px solid var(--gc, transparent); }
.rows li:first-child { border-top: 0; }
.rows li.off { opacity: 0.45; }
.rows .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.3; }
.rows small { display: block; font-size: 11px; color: var(--sub); font-weight: 500; }
.rows .tp { text-align: right; max-width: 48%; }
.rows .tp b { font-family: 'Dela Gothic One'; font-weight: 400; color: var(--gc); font-size: 18px; }
.rows .gap { color: var(--red) !important; }
.empty { border: 2px dashed var(--ink); padding: 20px; text-align: center; font-weight: 700; }
/* スキャン */
.now { display: flex; align-items: stretch; gap: 6px; margin-bottom: 10px; }
.nav-btn { width: 44px; border: 2px solid var(--ink); background: #fff; font-size: 28px; font-weight: 700; }
.who { flex: 1; border: 2px solid var(--ink); background: #fff; padding: 6px 10px; text-align: left; box-shadow: 3px 3px 0 var(--ink); }
.who > span { display: flex; align-items: center; gap: 8px; font-family: 'Dela Gothic One'; font-size: 20px; line-height: 1.3; }
.who small { display: block; font-size: 11px; color: var(--sub); font-weight: 700; }
.who .cur { color: var(--red); }
.cam { position: relative; aspect-ratio: 4 / 3; background: #111; border: 2px solid var(--ink); overflow: hidden; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.guide { position: absolute; left: 46%; right: 6%; top: 41%; height: 17%; border: 3px solid var(--yellow); box-shadow: 0 0 0 999px rgba(0,0,0,0.35); border-radius: 4px; }
.guide span { position: absolute; right: 0; top: -24px; background: var(--yellow); font-size: 11px; font-weight: 700; padding: 2px 8px; }
.guide.hit { animation: hit 0.5s; }
@keyframes hit { 0% { border-color: #3ddc84; box-shadow: 0 0 0 999px rgba(61,220,132,0.35); } }
.cam-off { position: absolute; inset: 0; display: grid; place-content: center; padding: 20px; text-align: center; color: #fff; background: rgba(20,20,20,0.8); }
.cam-off p { font-size: 13px; }
.status { min-height: 1.6em; margin-top: 8px; font-weight: 700; font-size: 14px; text-align: center; }
/* 設定 */
.card { border: 2px solid var(--ink); background: #fff; box-shadow: 3px 3px 0 var(--ink); padding: 14px; margin-bottom: 14px; }
.card h2 { margin: 0 0 6px; font-size: 16px; }
.big-num { font-family: 'Dela Gothic One'; font-size: 32px; margin: 0; }
.tier-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tier-table td { padding: 4px 6px; border-top: 1px solid var(--paper2); }
.tier-table .d { font-family: 'Dela Gothic One'; color: var(--gc); width: 44px; }
.tier-table .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.foot { color: var(--mute); font-size: 11px; }
.foot a { color: var(--sub); }
/* シート */
#sheet { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#sheet.open { pointer-events: auto; }
.sheet-bg { position: absolute; inset: 0; background: rgba(20,20,20,0.45); }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--paper); border-top: 3px solid var(--ink); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow-y: auto; }
.sheet-panel.tall { top: 6vh; display: flex; flex-direction: column; }
.sheet-title { display: flex; align-items: center; gap: 8px; font-family: 'Dela Gothic One'; font-size: 19px; margin-bottom: 6px; }
.sheet-body { color: var(--sub); margin: 0 0 6px; font-size: 14px; }
.pick-list { flex: 1; overflow-y: auto; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
.pick { display: flex; align-items: center; gap: 8px; border: 2px solid var(--ink); background: #fff; padding: 6px 8px; text-align: left; font-size: 13px; font-weight: 700; min-height: 44px; }
.pick.on { background: var(--yellow); }
.pick.done { border-style: dashed; }
.import-list { flex: 1; overflow-y: auto; display: grid; gap: 8px; }
.imp { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; border: 2px solid var(--ink); background: #fff; padding: 6px; }
.imp img { width: 110px; height: 62px; object-fit: cover; }
.imp-name { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
#toasts { position: fixed; top: 10px; left: 0; right: 0; z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: #fff; padding: 9px 16px; font-weight: 700; font-size: 14px; transform: translateY(-16px); opacity: 0; transition: 0.2s; }
.toast.in { transform: none; opacity: 1; }
.toast.warn { background: var(--red); }
.back { width: 36px; height: 44px; display: grid; place-items: center; border: 2px solid var(--ink); background: #fff; color: var(--ink); text-decoration: none; font-size: 26px; font-weight: 700; flex: none; }
.now.auto .who { cursor: default; }
.who .muted { color: var(--mute); font-family: inherit; font-size: 15px; }
.nav-btn.mode { width: 56px; font-size: 14px; line-height: 1.1; }
.nav-btn.mode small { display: block; font-size: 10px; }
.pick-list.cands { grid-template-columns: 1fr; }
.pick-list.cands .pick { font-size: 16px; min-height: 52px; }
.in.sel { padding: 5px 6px; font-size: 13px; margin-bottom: 4px; }
.in.sel.unsure { background: #fff5b8; }

.icon-mark { position: absolute; left: 25%; width: 14%; top: 39.5%; aspect-ratio: 1; border: 2px dashed rgba(255,255,255,0.85); border-radius: 6px; pointer-events: none; }
.icon-mark span { position: absolute; left: 0; top: -22px; white-space: nowrap; font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.55); padding: 1px 6px; }
/* ---- 動画からまとめて読む ---- */
.video-btn { flex-direction: column; margin-bottom: 10px; }
.video-btn small { font-family: 'Zen Kaku Gothic New'; font-size: 11px; font-weight: 700; opacity: 0.9; }
.or-line { text-align: center; font-size: 12px; color: var(--sub); margin: 4px 0 8px; font-weight: 700; }
.cal-wrap { position: relative; border: 2px solid var(--ink); background: #000; touch-action: none; overflow: hidden; }
.cal-frame { display: block; width: 100%; height: auto; }
.cal-box { position: absolute; border: 3px solid var(--yellow); box-shadow: 0 0 0 999px rgba(0,0,0,0.35); touch-action: none; cursor: move; }
.cal-box span { position: absolute; right: 0; top: -22px; background: var(--yellow); font-size: 11px; font-weight: 700; padding: 1px 6px; white-space: nowrap; }
.cal-handle { position: absolute; right: -12px; bottom: -12px; width: 24px; height: 24px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 50%; }
.cal-slider { width: 100%; margin: 10px 0 4px; }
.cal-info { min-height: 2.8em; font-weight: 700; }
.run-video { width: 100%; max-height: 30vh; background: #000; border: 2px solid var(--ink); }
.run-bar { height: 12px; border: 2px solid var(--ink); background: #fff; margin: 10px 0; }
.run-bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width 0.2s; }
.imp.vrow { grid-template-columns: 56px 1fr; }
.imp.vrow img { width: 56px; height: 56px; object-fit: cover; }
.imp.vrow.unsure { background: #fff8cc; }
.cand-row { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 4px; }
.cand { border: 1.5px solid var(--ink); background: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; }

</style>
</head>
