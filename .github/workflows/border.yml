name: VIPボーダーを更新
on:
  schedule:
    - cron: '17 21 * * *' # 毎日 6:17（日本時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/gsp/scripts/update-border.mjs gsp/border.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add gsp/border.json
          git commit -m "VIPボーダーを更新" || echo "変更なし"
          git push
